# Production CI for mollie-rs - blocking gates for public main.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract & drift gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: python -m pip install -r scripts/requirements.txt
      - name: Generation reproducibility
        run: python scripts/check_generation_reproducibility.py
      - name: Dangerous profile drift
        run: python scripts/check_dangerous_profile_drift.py
      - name: High-risk coverage report
        run: python scripts/report_high_risk_coverage.py --require-full
      - name: Independent mutation discovery
        run: python scripts/detect_high_risk_operations.py
      - name: OpenAPI drift fixture classifier
        run: python scripts/run_openapi_drift_fixtures.py
      - name: Tier-S request allowlist registry
        run: python scripts/check_tier_s_request_contracts.py
      - name: Tier-S public API snapshot
        run: python scripts/check_tier_s_public_api.py
      - name: Contract graph freshness
        run: |
          python scripts/build_contract_graph.py
          git diff --exit-code -- docs/registries/contract-graph.json
      - name: Semantic contract diff (local pin vs pin smoke)
        run: |
          python -m scripts.contract_diff --old specs-3.0.yaml --new specs-3.0.yaml --json target/contract-diff-smoke.json --fail-on-blocking
      - name: Operation registry is committed
        run: |
          python scripts/export_operation_registry.py
          git diff --exit-code -- docs/registries/operation-registry.yaml
      - name: Upstream OpenAPI pin (digest)
        run: |
          set -euo pipefail
          python scripts/fetch_upstream_openapi.py
          # Exit 0 = match, 2 = inventory advisory (do not block PRs), other = fail.
          set +e
          python scripts/compare_upstream_openapi.py --require-upstream
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "upstream inventory matches local pin"
          elif [ "$code" -eq 2 ]; then
            echo "::warning::upstream inventory differs from local pin (advisory)"
          else
            echo "compare_upstream_openapi failed with exit $code"
            exit "$code"
          fi

  quality:
    name: fmt, clippy, test & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Clippy (no default features)
        # Scoped to lib + tests, matching the no-default-features test step.
        # Examples require the default `app-helpers` feature (try_init_tracing,
        # dotenvy) and are compile-checked by the "Examples compile" step below.
        run: cargo clippy --lib --tests --no-default-features -- -D warnings
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (no default features)
        run: cargo test --lib --tests --no-default-features
      - name: Doc tests
        run: cargo test --doc --all-features
      - name: Examples compile
        run: cargo check --examples --all-features
      - name: rustdoc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: Build + lib tests on MSRV
        run: |
          cargo check --all-features
          cargo test --lib --all-features

  package:
    name: crates.io package dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: cargo package
        run: cargo package --allow-dirty --no-verify
      - name: cargo package (verify)
        run: cargo package --allow-dirty

  # Full-crate cargo-semver-checks vs crates.io (0.x: minor bumps may break).
  # Tier-S facade surface is *also* fail-closed via the contract job snapshot
  # (scripts/check_tier_s_public_api.py) — that is the application-facing SSOT.
  semver:
    name: cargo-semver-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-semver-checks
        # Pinned: newer releases require a rustc above this job's MSRV toolchain.
        # Bump in step with the MSRV.
        run: cargo install cargo-semver-checks --version 0.44.0 --locked
      - name: Check public API vs crates.io (fail-closed)
        run: cargo semver-checks check-release


