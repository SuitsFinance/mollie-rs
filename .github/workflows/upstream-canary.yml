# Informational canary: official Mollie SDK release tags (not codegen sources).
name: Upstream SDK canary

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe latest release tags (informational)
        run: |
          set -euo pipefail
          mkdir -p docs/generated
          python - <<'PY'
          import json, urllib.request
          from datetime import datetime, timezone
          repos = [
            "mollie/mollie-api-node",
            "mollie/mollie-api-golang",
            "mollie/mollie-api-python",
            "mollie/mollie-api-java",
            "mollie/mollie-api-csharp",
            "mollie/mollie-api-php",
          ]
          out = {"generated_at": datetime.now(timezone.utc).isoformat(), "sdks": {}}
          for repo in repos:
              url = f"https://api.github.com/repos/{repo}/releases/latest"
              try:
                  req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json", "User-Agent": "mollie-rs-canary"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
                  out["sdks"][repo] = {"tag": data.get("tag_name"), "published_at": data.get("published_at"), "html_url": data.get("html_url")}
              except Exception as exc:
                  out["sdks"][repo] = {"error": str(exc)}
          path = "docs/generated/upstream-canary.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2, sort_keys=True)
              f.write("\n")
          print(json.dumps(out, indent=2))
          PY
        continue-on-error: true
