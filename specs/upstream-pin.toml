# Authoritative upstream Mollie OpenAPI pin for parity / drift CI.
# Do not edit digests without re-running scripts/fetch_upstream_openapi.py.

[upstream]
# Primary source (official Mollie OpenAPI repository).
url = "https://raw.githubusercontent.com/mollie/openapi/main/specs.yaml"
# Optional mirror / Speakeasy export used by generated official SDKs:
# https://raw.githubusercontent.com/mollie/mollie-api-golang/main/.speakeasy/out.openapi.yaml
repository = "https://github.com/mollie/openapi"
ref = "main"
path = "specs.yaml"
# Snapshot verified 2026-08-19 (fetch script re-checks on each CI run).
sha256 = "3fb1b5127a6b023afaabd8ff318746fec2fc139b96de5c72a8fd994f3ccf6329"
operation_count = 128
pinned_date = "2026-08-19"
notes = "Re-pin 2026-08-19: upstream main digest 3fb1b512… and 128 operationIds; local specs-3.0.yaml remains at 124 operationIds (upstream drift advisory until deliberate adapt/codegen)."

[local]
spec = "specs-3.0.yaml"
operation_count = 124
capabilities = "src/route_capabilities.rs"
registry = "docs/registries/operation-registry.yaml"

[policy]
# Exit codes for scripts/compare_upstream_openapi.py:
# 0 = inventory OK (and upstream matches pin when fetched)
# 1 = local pin/capabilities/registry inconsistent
# 2 = upstream differs from local (advisory unless --strict-dangerous)
# 3 = upstream digest mismatch vs this pin (blocking)
dangerous_blocks_release = true
advisory_added_ops_in_pr_ci = true
