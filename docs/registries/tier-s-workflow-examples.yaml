# Tier-S workflow → compile-checked example mapping (EX-001 / SUI-2331).
# Do not hand-edit generated examples/*.rs; regenerate via scripts/route_examples.py.
# Gate: python scripts/check_workflow_examples.py
version: 1
examples_dir: examples
required_workflows:
  - id: payments.create
    title: Create payment
    tier_s:
      - facade:PaymentsApi
      - method:PaymentsApi.create
      - builder:CreatePaymentRequired
    examples:
      - create_payment.rs
    guides:
      - docs/guides/payments.md

  - id: payments.get
    title: Get payment
    tier_s:
      - method:PaymentsApi.get
    examples:
      - get_payment.rs
    guides:
      - docs/guides/payments.md

  - id: payments.list
    title: List payments (pagination entry)
    tier_s:
      - method:PaymentsApi.list_page
      - method:PaymentsApi.stream_pages
    examples:
      - list_payments.rs
    guides:
      - docs/guides/pagination.md

  - id: payments.update
    title: Update payment
    tier_s:
      - method:PaymentsApi.update
      - builder:UpdatePaymentRequired
    examples:
      - update_payment.rs

  - id: payments.cancel
    title: Cancel payment
    tier_s:
      - method:PaymentsApi.cancel
    examples:
      - cancel_payment.rs

  - id: refunds.create
    title: Create refund
    tier_s:
      - facade:RefundsApi
      - method:RefundsApi.create
      - builder:CreateRefundRequired
    examples:
      - create_refund.rs
    guides:
      - docs/guides/refunds.md

  - id: refunds.get
    title: Get refund
    tier_s:
      - method:RefundsApi.get
    examples:
      - get_refund.rs

  - id: refunds.list
    title: List refunds
    tier_s:
      - method:RefundsApi.list_page
      - method:RefundsApi.stream_items
    examples:
      - list_refunds.rs
      - list_all_refunds.rs

  - id: payouts.create
    title: Create payout
    tier_s:
      - facade:PayoutsApi
      - method:PayoutsApi.create
      - builder:CreatePayoutRequired
    examples:
      - create_payout.rs
    guides:
      - docs/guides/payouts-and-transfers.md

  - id: payouts.get
    title: Get payout
